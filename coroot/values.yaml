# Images multi-architectures résolues le 5 novembre 2026.
metricsRefreshInterval: 15s
authBootstrapAdminPasswordSecret:
  name: coroot-admin
  key: password
storage:
  size: 2Gi
  className: local-path
service:
  type: NodePort
  port: 8080
  nodePort: 30080
resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    memory: 1536Mi
nodeAgent:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  image:
    name: ghcr.io/coroot/coroot-node-agent@sha256:a1488ca3e541703fe4b4cdefeff2dae992cc9f45affd18f9f41e5b12a8016cae
clusterAgent:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  image:
    name: ghcr.io/coroot/coroot-cluster-agent@sha256:827ef8a0471e9957853cde5b2fbb58f1030c25d496a221020ee5f8ba12b2eb59
prometheus:
  retention: 6h
  storage:
    size: 2Gi
    className: local-path
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi
  image:
    name: ghcr.io/coroot/prometheus@sha256:c2a4f92f728411b834b7abd07764cf587e28749c377b157443569dea4f81f833
clickhouse:
  shards: 1
  replicas: 1
  storage:
    size: 8Gi
    className: local-path
  resources:
    requests:
      cpu: 300m
      memory: 1Gi
    limits:
      memory: 3Gi
  image:
    name: ghcr.io/coroot/clickhouse@sha256:8c73c5d8ab9dc3a4566b757e6ca4dd8d83058840e6b7efffe0191d6e8dbffce9
communityEdition:
  image:
    name: ghcr.io/coroot/coroot@sha256:ddb72d25bc68b615387306b788860c992e2a72a550e8db07d18a1c768976775d
