name: Vérifier ParcelFlow
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_USER: parcelflow
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: parcelflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U parcelflow -d parcelflow_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444b
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: app
      - run: npm test
        working-directory: app
        env:
          TEST_DATABASE_URL: postgresql://parcelflow:test-only-password@127.0.0.1:5432/parcelflow_test
      - run: for script in demo.sh scripts/*.sh; do bash -n "$script"; done
      - run: docker build -t parcelflow:1.0 app
