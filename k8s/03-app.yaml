      - name: web
        image: parcelflow:1.0
        imagePullPolicy: Never
        env:
        - name: ROLE
          value: catalog
        - name: APP_VERSION
          value: '1.0'
        - name: FAULT_PATH
          value: /faults/mode
        - name: PGHOST
          value: postgres
        - name: PGDATABASE
          value: parcelflow
        - name: PGUSER
          value: parcelflow
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: password
        ports:
        - name: http
          containerPort: 3000
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        startupProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 5
          failureThreshold: 24
        volumeMounts:
        - name: faults
          mountPath: /faults
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: faults
        configMap:
          name: faults
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: parcelflow
spec:
  selector:
    app: catalog
  ports:
  - name: http
    port: 3000
    targetPort: http
---
