apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic
  namespace: parcelflow
spec:
  replicas: 0
  selector:
    matchLabels:
      app: traffic
  template:
    metadata:
      labels:
        app: traffic
        app.kubernetes.io/part-of: parcelflow
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: traffic
        image: parcelflow:1.0
        imagePullPolicy: Never
        command:
        - node
        - src/traffic.cjs
        env:
        - name: TARGET_URL
          value: http://gateway:3000
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
